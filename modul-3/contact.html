<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Contact - Faisal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white">

<div class="max-w-md mx-auto p-6">

  <h1 class="text-3xl font-bold text-center mb-6">Hubungi Saya</h1>

  <form class="bg-gray-800 p-6 rounded-xl shadow space-y-4">

    <input type="text" placeholder="Nama"
      class="w-full p-3 rounded bg-gray-700 text-white focus:outline-none">

    <input type="email" placeholder="Email"
      class="w-full p-3 rounded bg-gray-700 text-white focus:outline-none">

    <textarea placeholder="Pesan"
      class="w-full p-3 rounded bg-gray-700 text-white focus:outline-none"></textarea>

    <button class="w-full bg-blue-600 py-3 rounded hover:bg-blue-500 transition">
      Kirim
    </button>

  </form>

  <div class="text-center mt-6">
    <a href="home.html" class="text-blue-400 hover:underline">Kembali ke Home</a>
  </div>

</div>

</body>
</html>
